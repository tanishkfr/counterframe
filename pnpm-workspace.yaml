# Install scripts are allowed only for these known-good native/binary packages:
# esbuild (Vitest bundler), sharp (Next.js image pipeline), unrs-resolver
# (ESLint module resolution). Nothing else may run scripts on install.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

# postcss and sharp arrive transitively through Next.js on versions carrying
# published advisories. Overrides are the only way to lift them, and pnpm 10+
# reads them from here rather than from package.json.
overrides:
  postcss: '>=8.5.23'
  sharp: '>=0.35.0'
